name: Publish to PyPI

on:
  push:
    tags:
      - v0.23.0

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1580601600"
  PYTHONDONTWRITEBYTECODE: "1"
  EXPECTED_WHEEL_SHA256: "5c2025e4f6d592bf4c927d659b4d729e17a62e49bc13f5b380de1b2d6bff480f"
  EXPECTED_SDIST_SHA256: "b80634643ab3c555e1733c93a3cd66281279b100c3247c3d8c54502346709fcd"
  CORE_WHEEL_SHA256: "56d4bd001c9c5875b6f7fec55369754c43a07f5d2ce0e334a2057c63521b858c"
  CORE_SDIST_SHA256: "4a8716cfd1e02c86165372ff005e241dc14346b5c6b51389fa634f9b3aecef5c"

jobs:
  validate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.23.0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: 0.13.5
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - name: Download and verify selected public Core artifacts
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "public-core"
          root.mkdir()
          data = json.load(urllib.request.urlopen("https://pypi.org/pypi/millrace-ai/0.23.0/json"))
          expected = {"millrace_ai-0.23.0-py3-none-any.whl": os.environ["CORE_WHEEL_SHA256"],
                      "millrace_ai-0.23.0.tar.gz": os.environ["CORE_SDIST_SHA256"]}
          for item in data["urls"]:
              if item["filename"] in expected:
                  raw = urllib.request.urlopen(item["url"]).read()
                  assert hashlib.sha256(raw).hexdigest() == expected[item["filename"]]
                  (root / item["filename"]).write_bytes(raw)
          assert {p.name for p in root.iterdir()} == set(expected)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("MILLRACE_TEST_CORE_WHEEL=" + str(root / "millrace_ai-0.23.0-py3-none-any.whl") + "\n")
              env.write("MILLRACE_TEST_CORE_SDIST=" + str(root / "millrace_ai-0.23.0.tar.gz") + "\n")
          PYCODE
      - name: Test matched public Core and Plus source
        run: |
          env -u PYTHONPATH PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run --no-project --python 3.11 --with pytest==9.1.1 --with hatchling==1.31.0 --with "$MILLRACE_TEST_CORE_WHEEL" --with . pytest -q
          uv run --no-project --python 3.11 --with ruff==0.15.21 ruff check src tests
      - name: Check clean source tree
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build
        run: |
          test ! -e dist
          uv build --force-pep517 --python 3.11
      - name: Verify selected distribution manifest
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          expected = {"millrace_plus-0.23.0-py3-none-any.whl": os.environ["EXPECTED_WHEEL_SHA256"],
                      "millrace_plus-0.23.0.tar.gz": os.environ["EXPECTED_SDIST_SHA256"]}
          assert {p.name for p in Path("dist").iterdir() if p.name != ".gitignore"} == set(expected)
          for name, digest in expected.items():
              assert digest != "0" * 64, "Release artifact manifest has not been frozen"
              assert hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest() == digest
          PYCODE
      - name: Check source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-distributions
          if-no-files-found: error
          path: |
            dist/millrace_plus-0.23.0-py3-none-any.whl
            dist/millrace_plus-0.23.0.tar.gz

  publish:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.23.0' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pypi-distributions
          path: dist/
      - name: Verify downloaded distribution set
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          assert {p.name for p in Path("dist").iterdir()} == {"millrace_plus-0.23.0-py3-none-any.whl", "millrace_plus-0.23.0.tar.gz"}
          files = sorted(Path("dist").iterdir())
          for path in files:
              key = "EXPECTED_WHEEL_SHA256" if path.suffix == ".whl" else "EXPECTED_SDIST_SHA256"
              assert hashlib.sha256(path.read_bytes()).hexdigest() == os.environ[key]
          PYCODE
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
