name: Publish to PyPI

on:
  push:
    tags:
      - v0.22.3

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MILLRACE_REF: 00303d9ec3410f3803f793cd7e722c24c84f7b1e
      MILLRACE_VERSION: 0.22.3
      MILLFORGE_REF: d660194f5641f51b5010d58852fde268865ff24f
      MILLFORGE_VERSION: 0.1.0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.9.30
      - name: Test
        shell: bash
        run: |
          validation_root="$RUNNER_TEMP/millrace-plus-validation"
          artifact_root="$validation_root/artifacts"
          mkdir -p "$artifact_root/millrace" "$artifact_root/millforge"

          git init --quiet "$validation_root/millrace"
          git -C "$validation_root/millrace" remote add origin \
            https://github.com/tim-osterhus/millrace.git
          git -C "$validation_root/millrace" fetch --quiet --depth 1 \
            origin "$MILLRACE_REF"
          git -C "$validation_root/millrace" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$validation_root/millrace" rev-parse HEAD)" = \
            "$MILLRACE_REF"

          git init --quiet "$validation_root/millforge"
          git -C "$validation_root/millforge" remote add origin \
            https://github.com/tim-osterhus/millforge.git
          git -C "$validation_root/millforge" fetch --quiet --depth 1 \
            origin "$MILLFORGE_REF"
          git -C "$validation_root/millforge" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$validation_root/millforge" rev-parse HEAD)" = \
            "$MILLFORGE_REF"

          uv build --wheel --out-dir "$artifact_root/millrace" \
            "$validation_root/millrace"
          uv build --wheel --out-dir "$artifact_root/millforge" \
            "$validation_root/millforge"

          mapfile -t millrace_wheels < <(
            find "$artifact_root/millrace" -maxdepth 1 -type f \
              -name "millrace_ai-${MILLRACE_VERSION}-*.whl" -print
          )
          mapfile -t millforge_wheels < <(
            find "$artifact_root/millforge" -maxdepth 1 -type f \
              -name "millforge-${MILLFORGE_VERSION}-*.whl" -print
          )
          if [[ "${#millrace_wheels[@]}" -ne 1 ]]; then
            printf 'expected exactly one Millrace %s wheel, found %s\n' \
              "$MILLRACE_VERSION" "${#millrace_wheels[@]}" >&2
            exit 1
          fi
          if [[ "${#millforge_wheels[@]}" -ne 1 ]]; then
            printf 'expected exactly one Millforge %s wheel, found %s\n' \
              "$MILLFORGE_VERSION" "${#millforge_wheels[@]}" >&2
            exit 1
          fi

          env -u PYTHONPATH \
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            uv run --no-project --python 3.11 \
              --with pytest==9.1.1 \
              --with hatchling==1.31.0 \
              --with "${millrace_wheels[0]}" \
              --with "${millforge_wheels[0]}" \
              pytest -q
      - name: Lint
        run: uv run --no-project --python 3.11 --with ruff==0.15.21 ruff check src tests
      - name: Check clean source tree
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build
        run: |
          test ! -e dist
          SOURCE_DATE_EPOCH=1580601600 PYTHONDONTWRITEBYTECODE=1 uv build --python 3.11 --force-pep517
      - name: Verify built distributions
        shell: bash
        run: |
          expected=(
            ".gitignore"
            "millrace_plus-0.22.3-py3-none-any.whl"
            "millrace_plus-0.22.3.tar.gz"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'unexpected distribution set: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          sha256sum --check --strict <<'SHA256'
          ee47d4885c2320cdc7ed0285843534a7ec19f583134221753d5169574d7aa401  dist/millrace_plus-0.22.3-py3-none-any.whl
          4ec1437eb29fbfdb105e3e54c4fa6607af5287f3615c9d218cc798774e2c4f78  dist/millrace_plus-0.22.3.tar.gz
          SHA256
      - name: Check source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-distributions
          if-no-files-found: error
          path: |
            dist/millrace_plus-0.22.3-py3-none-any.whl
            dist/millrace_plus-0.22.3.tar.gz

  publish:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.22.3' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pypi-distributions
          path: dist/
      - name: Verify downloaded distributions
        shell: bash
        run: |
          expected=(
            "millrace_plus-0.22.3-py3-none-any.whl"
            "millrace_plus-0.22.3.tar.gz"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'unexpected downloaded distribution set: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          sha256sum --check --strict <<'SHA256'
          ee47d4885c2320cdc7ed0285843534a7ec19f583134221753d5169574d7aa401  dist/millrace_plus-0.22.3-py3-none-any.whl
          4ec1437eb29fbfdb105e3e54c4fa6607af5287f3615c9d218cc798774e2c4f78  dist/millrace_plus-0.22.3.tar.gz
          SHA256
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
