name: Publish to PyPI

on:
  push:
    tags:
      - v0.22.3

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Bind the reviewed Core wheel to its immutable release source.
      MILLRACE_REF: e19aada8a49f9e0e422667d43eb51653ce405f6d
      MILLRACE_AI_WHEEL_SHA256: 5e87f92f2330af30395f35860d319db7e5574367da7995a3613276d0a08f163d
      MILLRACE_VERSION: 0.22.3
      MILLFORGE_VERSION: 0.1.1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.9.30
      - name: Test complete installed-wheel suite
        shell: bash
        run: |
          validation_root="$RUNNER_TEMP/millrace-plus-validation"
          artifact_root="$validation_root/artifacts"
          mkdir -p "$artifact_root/millrace"

          if [[ ! "$MILLRACE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "MILLRACE_REF must be replaced with the final immutable Core commit SHA" >&2
            exit 1
          fi
          if [[ ! "$MILLRACE_AI_WHEEL_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "MILLRACE_AI_WHEEL_SHA256 must be replaced with the final Core wheel SHA-256" >&2
            exit 1
          fi

          git init --quiet "$validation_root/millrace"
          git -C "$validation_root/millrace" remote add origin \
            https://github.com/tim-osterhus/millrace.git
          git -C "$validation_root/millrace" fetch --quiet --depth 1 \
            origin "$MILLRACE_REF"
          git -C "$validation_root/millrace" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$validation_root/millrace" rev-parse HEAD)" = \
            "$MILLRACE_REF"

          SOURCE_DATE_EPOCH=1580601600 PYTHONDONTWRITEBYTECODE=1 \
            uv build --wheel --force-pep517 --out-dir "$artifact_root/millrace" \
              "$validation_root/millrace"

          mapfile -t millrace_wheels < <(
            find "$artifact_root/millrace" -maxdepth 1 -type f \
              -name "millrace_ai-${MILLRACE_VERSION}-*.whl" -print
          )
          if [[ "${#millrace_wheels[@]}" -ne 1 ]]; then
            printf 'expected exactly one Millrace %s wheel, found %s\n' \
              "$MILLRACE_VERSION" "${#millrace_wheels[@]}" >&2
            exit 1
          fi
          printf '%s  %s\n' "$MILLRACE_AI_WHEEL_SHA256" \
            "${millrace_wheels[0]}" | sha256sum --check --strict

          env -u PYTHONPATH \
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            uv run --no-project --python 3.11 \
              --with pytest==9.1.1 \
              --with hatchling==1.31.0 \
              --with "${millrace_wheels[0]}" \
              --with millforge=="$MILLFORGE_VERSION" \
              pytest -q

      - name: Lint
        run: uv run --no-project --python 3.11 --with ruff==0.15.21 ruff check src tests
      - name: Check clean source tree
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build
        run: |
          test ! -e dist
          SOURCE_DATE_EPOCH=1580601600 PYTHONDONTWRITEBYTECODE=1 uv build --python 3.11 --force-pep517
      - name: Verify built distributions
        shell: bash
        run: |
          expected=(
            ".gitignore"
            "millrace_plus-0.22.3-py3-none-any.whl"
            "millrace_plus-0.22.3.tar.gz"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'unexpected distribution set: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          sha256sum --check --strict <<'SHA256'
          8a36188ded6445be1657e4cd327a34a88b7bf9ac2fe2a4942e0eda67b7ef6f7c  dist/millrace_plus-0.22.3-py3-none-any.whl
          caf4ed3f586d5ff3d8d525d3bfd5292dc0f28db79418c01ee59c60ca6955c72d  dist/millrace_plus-0.22.3.tar.gz
          SHA256
      - name: Check source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-distributions
          if-no-files-found: error
          path: |
            dist/millrace_plus-0.22.3-py3-none-any.whl
            dist/millrace_plus-0.22.3.tar.gz

  publish:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.22.3' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pypi-distributions
          path: dist/
      - name: Verify downloaded distributions
        shell: bash
        run: |
          expected=(
            "millrace_plus-0.22.3-py3-none-any.whl"
            "millrace_plus-0.22.3.tar.gz"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'unexpected downloaded distribution set: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          sha256sum --check --strict <<'SHA256'
          8a36188ded6445be1657e4cd327a34a88b7bf9ac2fe2a4942e0eda67b7ef6f7c  dist/millrace_plus-0.22.3-py3-none-any.whl
          caf4ed3f586d5ff3d8d525d3bfd5292dc0f28db79418c01ee59c60ca6955c72d  dist/millrace_plus-0.22.3.tar.gz
          SHA256
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
