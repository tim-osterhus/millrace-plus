name: Publish to PyPI

on:
  push:
    tags:
      - v0.23.2

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1580601600"
  PYTHONDONTWRITEBYTECODE: "1"
  OS_PEER_SOURCE_SHA: "be22a127aa08a8959b4b674e49f2182708da7605"
  # All-zero digests mark unfrozen values; every check below refuses them.
  # Plus: digests of the checked 0.23.2 build. Any change to an sdist member
  # (README, docs/*.md, tests, src, public-ci.yml) requires a rebuild and refreeze.
  EXPECTED_WHEEL_SHA256: "c203a46db469618688954d90594fbc5dd5ffba66fc3f2b170f8f1431025ff8bf"
  EXPECTED_SDIST_SHA256: "31d89767d641a9a9fdb3ae35eb795ca578981e57ecd043337c9cba353ff67659"
  # Core: the exact public millrace-ai 0.23.2 wheel and sdist (Core publishes first).
  CORE_WHEEL_SHA256: "bc6ccd5a3de66c32d4e9122fa467cae6f01f0fabbb541d8a83893ab40542b41a"
  CORE_SDIST_SHA256: "b1b8123f05ea092aca38d884dc27b853acd41ca6a1ac970842b85645c140315a"

jobs:
  validate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.23.2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release tag and package identity
        run: |
          python3 - <<'PYCODE'
          import os, subprocess, tomllib
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert os.environ["GITHUB_EVENT_NAME"] == "push"
          assert os.environ["GITHUB_REF"] == "refs/tags/v0.23.2"
          head = git("rev-parse", "HEAD")
          assert git("rev-parse", "refs/tags/v0.23.2^{}") == head
          assert os.environ["GITHUB_SHA"] == head
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "millrace-plus" and project["version"] == "0.23.2"
          PYCODE
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: tim-osterhus/millrace-os
          ref: ${{ env.OS_PEER_SOURCE_SHA }}
          path: .ci-os
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: 0.13.5
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - name: Download and verify selected public Core artifacts
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "public-core"
          root.mkdir()
          data = json.load(urllib.request.urlopen("https://pypi.org/pypi/millrace-ai/0.23.2/json", timeout=60))
          assert data["info"]["version"] == "0.23.2"
          expected = {"millrace_ai-0.23.2-py3-none-any.whl": os.environ["CORE_WHEEL_SHA256"],
                      "millrace_ai-0.23.2.tar.gz": os.environ["CORE_SDIST_SHA256"]}
          for digest in expected.values():
              assert digest != "0" * 64, "Core artifact digests have not been frozen"
          for name, digest in expected.items():
              item, = [item for item in data["urls"] if item["filename"] == name]
              assert item["yanked"] is False, f"{name} is yanked"
              assert item["digests"]["sha256"] == digest, f"{name}: registry digest differs"
              raw = urllib.request.urlopen(item["url"], timeout=60).read()
              assert hashlib.sha256(raw).hexdigest() == digest, f"{name}: downloaded digest differs"
              (root / name).write_bytes(raw)
          assert {p.name for p in root.iterdir()} == set(expected)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("MILLRACE_TEST_CORE_WHEEL=" + str(root / "millrace_ai-0.23.2-py3-none-any.whl") + "\n")
              env.write("MILLRACE_TEST_CORE_SDIST=" + str(root / "millrace_ai-0.23.2.tar.gz") + "\n")
          PYCODE
      # OS source peer with the router request capability route and joined calls.
      # Its package version is 0.23.1; no OS publication is required.
      - name: Build isolated accepted OS peer for deterministic bridge tests
        run: |
          test "$(git -C .ci-os rev-parse HEAD)" = "$OS_PEER_SOURCE_SHA"
          uv build .ci-os --wheel --out-dir "$RUNNER_TEMP/os-peer" --force-pep517 --python 3.12
          test "$(ls "$RUNNER_TEMP/os-peer")" = millrace_os-0.23.1-py3-none-any.whl
          echo "MILLRACE_TEST_OS_PEER_WHEEL=$RUNNER_TEMP/os-peer/millrace_os-0.23.1-py3-none-any.whl" >> "$GITHUB_ENV"
      - name: Download immutable package replacement baseline
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "baseline-plus"
          root.mkdir()
          name = "millrace_plus-0.23.0-py3-none-any.whl"
          digest = "5c2025e4f6d592bf4c927d659b4d729e17a62e49bc13f5b380de1b2d6bff480f"
          release = json.load(urllib.request.urlopen("https://pypi.org/pypi/millrace-plus/0.23.0/json", timeout=60))
          item, = [item for item in release["urls"] if item["filename"] == name]
          assert item["yanked"] is False, f"{name} is yanked"
          assert item["digests"]["sha256"] == digest
          raw = urllib.request.urlopen(item["url"], timeout=60).read()
          assert hashlib.sha256(raw).hexdigest() == digest
          path = root / name
          path.write_bytes(raw)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("MILLRACE_TEST_BASELINE_PLUS_WHEEL=" + str(path) + "\n")
          PYCODE
      - name: Cache pinned Core backend for offline distribution proofs
        run: >-
          uv run --no-project --python 3.12
          --with 'uv_build==0.11.30'
          python -c 'import uv_build'
      - name: Test matched public Core and Plus source
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import tomllib
          paths = tomllib.load(open("pyproject.toml", "rb"))["tool"]["pytest"]["ini_options"]["testpaths"]
          sessions = ["tests/router", "tests/test_package_metadata.py", "tests/test_public_package_boundary.py",
                      "tests/test_agent_skill_assets.py", "tests/test_public_test_support_boundary.py", "tests/demo"]
          assert sorted(paths) == sorted(sessions), paths
          PYCODE
          # tests/demo runs separately: tests/demo/test_cli.py and tests/router/test_cli.py share
          # a module basename. Service tests bind AF_UNIX sockets under tmp_path, so the base
          # temporary directory stays short.
          base="$(mktemp -d /tmp/mp.XXXXXX)"
          plus_pytest() {
            env -u PYTHONPATH PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run --no-project --python 3.12 \
              --with pytest==9.1.1 --with hatchling==1.32.4 --with httpx==0.28.1 \
              --with "$MILLRACE_TEST_CORE_WHEEL" --with "$MILLRACE_TEST_OS_PEER_WHEEL" --with . pytest "$@"
          }
          for session in main demo; do
            if [ "$session" = main ]; then
              set -- tests/router tests/test_package_metadata.py tests/test_public_package_boundary.py \
                tests/test_agent_skill_assets.py tests/test_public_test_support_boundary.py
            else
              set -- tests/demo
            fi
            plus_pytest -q --collect-only "$@" > "$RUNNER_TEMP/plus-$session.ids"
            plus_pytest -x -v -ra --basetemp="$base/$session" --junitxml="$RUNNER_TEMP/plus-$session.xml" "$@"
          done
          python3 - <<'PYCODE'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          # Optional proofs whose task-owned inputs CI does not supply. Any other skip fails.
          allowed = [
              ("tests.router.test_paperclip_plugin", "task-owned pinned Node/loader profile is unavailable"),
              ("tests.router.test_lad_compatibility", "Exact retained old Core inputs required for v7 integration"),
              ("tests.router.test_cicd_push_workflow", "requires the admitted B0 receiver on omarchy-1"),
              ("tests.router.test_forge_distribution", "no real CPython 3.11 available"),
              ("tests.router.test_forge_distribution", "unrun: no admitted artifact manifest named by"),
              ("tests.router.test_forge_responses", "could not import 'forge'"),
              ("tests.router.test_forge_responses", "this case requires the pinned Forge SDK"),
              ("tests.router.test_millforge_configuration", "public digest vectors require explicit Millforge and Node"),
              ("tests.router.test_millforge_distribution", "installed M4 proof requires explicit prebuilt artifact inputs"),
          ]
          for session in ("main", "demo"):
              ids = [line for line in (root / f"plus-{session}.ids").read_text().splitlines() if "::" in line]
              cases = list(ET.parse(root / f"plus-{session}.xml").iter("testcase"))
              assert ids and len(cases) == len(ids), (session, len(cases), len(ids))
              broken = [c.attrib["name"] for c in cases if c.find("failure") is not None or c.find("error") is not None]
              assert not broken, (session, broken)
              unknown, skipped = [], 0
              for case in cases:
                  skip = case.find("skipped")
                  if skip is None:
                      continue
                  skipped += 1
                  module, text = case.attrib["classname"], skip.attrib.get("message", "") + " " + (skip.text or "")
                  if not any((module == m or module.startswith(m + ".")) and r in text for m, r in allowed):
                      unknown.append((module, case.attrib["name"], skip.attrib.get("message")))
              assert not unknown, unknown
              print(session, len(cases), "cases,", skipped, "allowed skips")
          PYCODE
          uv run --no-project --python 3.12 --with ruff==0.15.21 ruff check src tests
      - name: Check clean source tree
        run: test -z "$(git status --porcelain=v1 --untracked-files=all -- . ':(exclude).ci-os')"
      - name: Build
        run: |
          test ! -e dist
          uv build --force-pep517 --python 3.12
      - name: Verify selected distribution manifest
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          expected = {"millrace_plus-0.23.2-py3-none-any.whl": os.environ["EXPECTED_WHEEL_SHA256"],
                      "millrace_plus-0.23.2.tar.gz": os.environ["EXPECTED_SDIST_SHA256"]}
          assert {p.name for p in Path("dist").iterdir() if p.name != ".gitignore"} == set(expected)
          for name, digest in expected.items():
              assert digest != "0" * 64, "Release artifact manifest has not been frozen"
              actual = hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest()
              assert actual == digest, f"{name}: expected {digest}, actual {actual}"
          PYCODE
      - name: Check source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-distributions
          if-no-files-found: error
          path: |
            dist/millrace_plus-0.23.2-py3-none-any.whl
            dist/millrace_plus-0.23.2.tar.gz

  publish:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.23.2' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pypi-distributions
          path: dist/
      - name: Verify downloaded distribution set
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          assert {p.name for p in Path("dist").iterdir()} == {"millrace_plus-0.23.2-py3-none-any.whl", "millrace_plus-0.23.2.tar.gz"}
          files = sorted(Path("dist").iterdir())
          for path in files:
              key = "EXPECTED_WHEEL_SHA256" if path.suffix == ".whl" else "EXPECTED_SDIST_SHA256"
              assert os.environ[key] != "0" * 64, "Release artifact manifest has not been frozen"
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == os.environ[key], f"{path.name}: expected {os.environ[key]}, actual {actual}"
          PYCODE
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
