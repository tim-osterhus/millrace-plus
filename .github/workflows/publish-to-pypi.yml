name: Publish to PyPI

on:
  push:
    tags:
      - v0.23.1

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1580601600"
  PYTHONDONTWRITEBYTECODE: "1"
  OS_PEER_SOURCE_SHA: "72bc08d81182822483e57e70ae309ed0fe9c31c7"
  EXPECTED_WHEEL_SHA256: "1776de8f95e6f2bc7fa93ebe11f0fda7cc161b8bca2798ed6d57eccca37026d7"
  EXPECTED_SDIST_SHA256: "50e048f257be31526ca4d282edb27dd2a2b57927ba71cd066269319589646122"
  CORE_WHEEL_SHA256: "b5c2ac37259031136384e1d573dae8ea0e7597e5b1c792bd26ae42c019ab7778"
  CORE_SDIST_SHA256: "9cd836b5c689444def1c2351360a817f4455ad5756baf69b73b5d08ca0132489"

jobs:
  validate:
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.23.1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release tag and package identity
        run: |
          python3 - <<'PYCODE'
          import os, subprocess, tomllib
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert os.environ["GITHUB_EVENT_NAME"] == "push"
          assert os.environ["GITHUB_REF"] == "refs/tags/v0.23.1"
          head = git("rev-parse", "HEAD")
          assert git("rev-parse", "refs/tags/v0.23.1^{}") == head
          assert os.environ["GITHUB_SHA"] == head
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "millrace-plus" and project["version"] == "0.23.1"
          PYCODE
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: tim-osterhus/millrace-os
          ref: ${{ env.OS_PEER_SOURCE_SHA }}
          path: .ci-os
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: 0.13.5
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - name: Download and verify selected public Core artifacts
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "public-core"
          root.mkdir()
          data = json.load(urllib.request.urlopen("https://pypi.org/pypi/millrace-ai/0.23.1/json"))
          expected = {"millrace_ai-0.23.1-py3-none-any.whl": os.environ["CORE_WHEEL_SHA256"],
                      "millrace_ai-0.23.1.tar.gz": os.environ["CORE_SDIST_SHA256"]}
          for item in data["urls"]:
              if item["filename"] in expected:
                  raw = urllib.request.urlopen(item["url"]).read()
                  assert hashlib.sha256(raw).hexdigest() == expected[item["filename"]]
                  (root / item["filename"]).write_bytes(raw)
          assert {p.name for p in root.iterdir()} == set(expected)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("MILLRACE_TEST_CORE_WHEEL=" + str(root / "millrace_ai-0.23.1-py3-none-any.whl") + "\n")
              env.write("MILLRACE_TEST_CORE_SDIST=" + str(root / "millrace_ai-0.23.1.tar.gz") + "\n")
          PYCODE
      - name: Build isolated accepted OS peer for deterministic bridge tests
        run: |
          test "$(git -C .ci-os rev-parse HEAD)" = "$OS_PEER_SOURCE_SHA"
          uv build .ci-os --wheel --out-dir "$RUNNER_TEMP/os-peer" --force-pep517 --python 3.12
          echo "MILLRACE_TEST_OS_PEER_WHEEL=$RUNNER_TEMP/os-peer/millrace_os-0.23.0-py3-none-any.whl" >> "$GITHUB_ENV"
      - name: Download immutable package replacement baseline
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "baseline-plus"
          root.mkdir()
          name = "millrace_plus-0.23.0-py3-none-any.whl"
          digest = "5c2025e4f6d592bf4c927d659b4d729e17a62e49bc13f5b380de1b2d6bff480f"
          release = json.load(urllib.request.urlopen("https://pypi.org/pypi/millrace-plus/0.23.0/json", timeout=60))
          item, = [item for item in release["urls"] if item["filename"] == name]
          assert item["digests"]["sha256"] == digest
          raw = urllib.request.urlopen(item["url"], timeout=60).read()
          assert hashlib.sha256(raw).hexdigest() == digest
          path = root / name
          path.write_bytes(raw)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("MILLRACE_TEST_BASELINE_PLUS_WHEEL=" + str(path) + "\n")
          PYCODE
      - name: Cache pinned Core backend for offline distribution proofs
        run: >-
          uv run --no-project --python 3.12
          --with 'uv_build==0.11.30'
          python -c 'import uv_build'
      - name: Test matched public Core and Plus source
        run: |
          env -u PYTHONPATH PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run --no-project --python 3.12 --with pytest==9.1.1 --with hatchling==1.32.4 --with "$MILLRACE_TEST_CORE_WHEEL" --with "$MILLRACE_TEST_OS_PEER_WHEEL" --with . pytest -q -ra --junitxml="$RUNNER_TEMP/plus-results.xml"
          python3 - <<'PYCODE'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          results = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "plus-results.xml")
          cases = list(results.iter("testcase"))
          assert len(cases) == 1028, len(cases)
          skipped = [case for case in cases if case.find("skipped") is not None]
          assert len(skipped) == 21, len(skipped)
          for case in skipped:
              assert "test_paperclip_plugin" in case.attrib["classname"]
              assert "task-owned pinned Node/loader profile is unavailable" in case.find("skipped").attrib["message"]
          PYCODE
          uv run --no-project --python 3.12 --with ruff==0.15.21 ruff check src tests
      - name: Check clean source tree
        run: test -z "$(git status --porcelain=v1 --untracked-files=all -- . ':(exclude).ci-os')"
      - name: Build
        run: |
          test ! -e dist
          uv build --force-pep517 --python 3.12
      - name: Verify selected distribution manifest
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          expected = {"millrace_plus-0.23.1-py3-none-any.whl": os.environ["EXPECTED_WHEEL_SHA256"],
                      "millrace_plus-0.23.1.tar.gz": os.environ["EXPECTED_SDIST_SHA256"]}
          assert {p.name for p in Path("dist").iterdir() if p.name != ".gitignore"} == set(expected)
          for name, digest in expected.items():
              assert digest != "0" * 64, "Release artifact manifest has not been frozen"
              assert hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest() == digest
          PYCODE
      - name: Check source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-distributions
          if-no-files-found: error
          path: |
            dist/millrace_plus-0.23.1-py3-none-any.whl
            dist/millrace_plus-0.23.1.tar.gz

  publish:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.23.1' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pypi-distributions
          path: dist/
      - name: Verify downloaded distribution set
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          assert {p.name for p in Path("dist").iterdir()} == {"millrace_plus-0.23.1-py3-none-any.whl", "millrace_plus-0.23.1.tar.gz"}
          files = sorted(Path("dist").iterdir())
          for path in files:
              key = "EXPECTED_WHEEL_SHA256" if path.suffix == ".whl" else "EXPECTED_SDIST_SHA256"
              assert hashlib.sha256(path.read_bytes()).hexdigest() == os.environ[key]
          PYCODE
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
