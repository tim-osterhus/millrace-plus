name: Public CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1580601600"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  public-validation:
    if: github.ref != 'refs/heads/codex/v0231-plus-build-diagnostic-20261023'
    name: Public standalone validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Public standalone tests
        run: |
          env -u PYTHONPATH PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONDONTWRITEBYTECODE=1 uv run --no-project --with pytest --with hatchling pytest -q \
            tests/test_package_metadata.py \
            tests/test_public_package_boundary.py \
            tests/test_agent_skill_assets.py \
            tests/test_public_test_support_boundary.py \
            tests/router/test_catalog.py \
            tests/router/test_catalog_settings.py

      - name: Build distribution
        run: |
          rm -rf /tmp/millrace-plus-build
          PYTHONDONTWRITEBYTECODE=1 uv build --out-dir /tmp/millrace-plus-build --force-pep517

      - name: No millrace runtime package shipped
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          wheel = next(Path('/tmp/millrace-plus-build').glob('*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              names = sorted(archive.namelist())
          assert not any(name.startswith('millrace/') for name in names)
          assert any(name.startswith('millrace_plus/') for name in names)
          assert any(name.startswith('millrace_plus/skills/') for name in names)
          assert not any(name.startswith('millrace_workflow_package/') for name in names)
          assert any(name.startswith('millrace_plus/workflows/') for name in names)
          assert 'millrace_plus/router/cli.py' in names
          assert 'millrace_plus/router/pi.py' in names
          PY

      - name: Lint
        run: uv run --no-project --with ruff ruff check src tests

      - name: Diff whitespace
        run: git diff --check

  matched-validation:
    if: github.ref != 'refs/heads/codex/v0231-plus-build-diagnostic-20261023'
    timeout-minutes: 30
    name: Exact Core and Plus validation
    runs-on: ubuntu-latest
    env:
      CORE_SOURCE_SHA: dea6bc3f1529f9ca1ced665ccff050c8f4f58884
      OS_PEER_SOURCE_SHA: 72bc08d81182822483e57e70ae309ed0fe9c31c7
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: tim-osterhus/millrace
          ref: ${{ env.CORE_SOURCE_SHA }}
          path: .ci-core
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: tim-osterhus/millrace-os
          ref: ${{ env.OS_PEER_SOURCE_SHA }}
          path: .ci-os
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: 0.13.5
      - name: Build exact selected Core
        run: |
          test "$(git -C .ci-core rev-parse HEAD)" = "$CORE_SOURCE_SHA"
          uv build .ci-core --out-dir "$RUNNER_TEMP/core-dist" --force-pep517 --python 3.12
          echo "MILLRACE_TEST_CORE_WHEEL=$RUNNER_TEMP/core-dist/millrace_ai-0.23.1-py3-none-any.whl" >> "$GITHUB_ENV"
          echo "MILLRACE_TEST_CORE_SDIST=$RUNNER_TEMP/core-dist/millrace_ai-0.23.1.tar.gz" >> "$GITHUB_ENV"
      - name: Build isolated accepted OS peer for deterministic bridge tests
        run: |
          test "$(git -C .ci-os rev-parse HEAD)" = "$OS_PEER_SOURCE_SHA"
          uv build .ci-os --wheel --out-dir "$RUNNER_TEMP/os-peer" --force-pep517 --python 3.12
          echo "MILLRACE_TEST_OS_PEER_WHEEL=$RUNNER_TEMP/os-peer/millrace_os-0.23.0-py3-none-any.whl" >> "$GITHUB_ENV"
      - name: Download immutable package replacement baseline
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "baseline-plus"
          root.mkdir()
          name = "millrace_plus-0.23.0-py3-none-any.whl"
          digest = "5c2025e4f6d592bf4c927d659b4d729e17a62e49bc13f5b380de1b2d6bff480f"
          release = json.load(urllib.request.urlopen("https://pypi.org/pypi/millrace-plus/0.23.0/json", timeout=60))
          item, = [item for item in release["urls"] if item["filename"] == name]
          assert item["digests"]["sha256"] == digest
          raw = urllib.request.urlopen(item["url"], timeout=60).read()
          assert hashlib.sha256(raw).hexdigest() == digest
          path = root / name
          path.write_bytes(raw)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("MILLRACE_TEST_BASELINE_PLUS_WHEEL=" + str(path) + "\n")
          PYCODE
      - name: Cache Core backend for offline distribution proofs
        run: uv run --no-project --python 3.12 --with 'uv_build==0.11.30' python -c 'import uv_build'
      - name: Full matched artifact suite
        run: |
          env -u PYTHONPATH uv run --no-project --python 3.12 --with pytest==9.1.1 --with hatchling==1.32.4 --with "$MILLRACE_TEST_CORE_WHEEL" --with "$MILLRACE_TEST_OS_PEER_WHEEL" --with . pytest -q -ra --junitxml="$RUNNER_TEMP/plus-results.xml"
          python3 - <<'PYCODE'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          results = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "plus-results.xml")
          cases = list(results.iter("testcase"))
          assert len(cases) == 1028, len(cases)
          skipped = [case for case in cases if case.find("skipped") is not None]
          assert len(skipped) == 21, len(skipped)
          for case in skipped:
              assert "test_paperclip_plugin" in case.attrib["classname"]
              assert "task-owned pinned Node/loader profile is unavailable" in case.find("skipped").attrib["message"]
          PYCODE
          uv run --no-project --python 3.12 --with ruff==0.15.21 ruff check src tests
      - name: Check source unchanged
        run: git diff --exit-code

  release-build-diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/v0231-plus-build-diagnostic-20261023'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      DIAGNOSTIC_OUTPUT: /tmp/millrace-plus-build-diagnostic
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 92b0c12ab2c917a93122c56f21e28e611763f264
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: tim-osterhus/millrace-os
          ref: 72bc08d81182822483e57e70ae309ed0fe9c31c7
          path: .ci-os
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: 0.13.5
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - name: Record frozen source and resolved interpreter
        run: |
          test "$(git rev-parse HEAD)" = 92b0c12ab2c917a93122c56f21e28e611763f264
          test -z "$(git status --porcelain=v1 --untracked-files=all -- . ':(exclude).ci-os')"
          mkdir -m 700 "$DIAGNOSTIC_OUTPUT"
          uv --version > "$DIAGNOSTIC_OUTPUT/uv-version.txt"
          DIAGNOSTIC_PYTHON=$(uv python find 3.12)
          "$DIAGNOSTIC_PYTHON" - <<'PYCODE'
          import json, os, subprocess, sys, zlib
          from pathlib import Path
          report = {"source": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                    "workflow_commit": os.environ["GITHUB_SHA"],
                    "interpreter": sys.executable, "version": sys.version,
                    "zlib_build": zlib.ZLIB_VERSION, "zlib_runtime": zlib.ZLIB_RUNTIME_VERSION,
                    "scope": "Hosted reproduction, not recovered failed-run artifacts"}
          (Path(os.environ["DIAGNOSTIC_OUTPUT"]) / "runtime.json").write_text(json.dumps(report, indent=2) + "\n")
          PYCODE
      - name: Build the exact peer in the publisher checkout context
        run: |
          test "$(git -C .ci-os rev-parse HEAD)" = 72bc08d81182822483e57e70ae309ed0fe9c31c7
          uv build .ci-os --wheel --out-dir "$RUNNER_TEMP/diagnostic-os-peer" --force-pep517 --python 3.12 > "$DIAGNOSTIC_OUTPUT/os-peer-build.log" 2>&1
      - name: Reproduce publisher build and preserve both archives
        run: |
          uv -v build --force-pep517 --python 3.12 > "$DIAGNOSTIC_OUTPUT/build.log" 2>&1
          python3 - <<'PYCODE'
          import hashlib, json, os, shutil, tarfile, zipfile
          from pathlib import Path
          root = Path(os.environ["DIAGNOSTIC_OUTPUT"])
          expected = {"millrace_plus-0.23.1-py3-none-any.whl": "6a6718ad1e733ac25113bd464d8f46737a89364050ceaa7b54c1b03967c1cb30",
                      "millrace_plus-0.23.1.tar.gz": "b666e736f8ffa3a4df98039f6197c9da1b36729a645479f1e69ff3ca27d440f2"}
          files, members = {}, {}
          for p in Path("dist").iterdir():
              if p.name == ".gitignore":
                  continue
              files[p.name] = {"sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                               "bytes": p.stat().st_size, "expected_sha256": expected.get(p.name)}
              if p.suffix == ".whl":
                  with zipfile.ZipFile(p) as archive:
                      members[p.name] = [{"name": i.filename, "bytes": i.file_size,
                                          "sha256": hashlib.sha256(archive.read(i)).hexdigest(),
                                          "mode": i.external_attr >> 16, "time": i.date_time,
                                          "compression": i.compress_type} for i in archive.infolist()]
              elif p.name.endswith(".tar.gz"):
                  with tarfile.open(p) as archive:
                      members[p.name] = [{"name": i.name, "bytes": i.size,
                                          "sha256": hashlib.sha256(archive.extractfile(i).read()).hexdigest() if i.isfile() else None,
                                          "mode": i.mode, "mtime": i.mtime} for i in archive.getmembers()]
          safe = set(files) == set(expected) and all(files[n]["sha256"] == h for n, h in expected.items())
          (root / "artifacts.json").write_text(json.dumps({"files": files, "members": members,
                                                          "raw_archive_upload_safe": safe}, indent=2) + "\n")
          if safe:
              (root / "dist").mkdir()
              for name in expected:
                  shutil.copyfile(Path("dist") / name, root / "dist" / name)
          assert safe, "Unexpected archive bytes: raw archives withheld; names/hash/header report retained"
          PYCODE
          uv run --no-project --python 3.12 --with hatchling==1.32.4 python - <<'PYCODE' > "$DIAGNOSTIC_OUTPUT/resolved-backend.json"
          import importlib.metadata as m, json
          print(json.dumps({"scope": "Resolver comparison; actual isolated build resolution is in build.log",
                            "versions": {n: m.version(n) for n in ("hatchling", "packaging", "pathspec", "pluggy", "trove-classifiers")}}, indent=2))
          PYCODE
      - name: Upload diagnostic bytes and reports without publishing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frozen-plus-build-diagnostic
          if-no-files-found: error
          path: ${{ env.DIAGNOSTIC_OUTPUT }}
