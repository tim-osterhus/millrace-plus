[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "millrace-plus"
version = "0.23.0"
description = "Official workflow packages and agent skill assets for Millrace."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]

[project.optional-dependencies]
# The public execution-v2 handshake additionally checks runtime compatibility.
router = ["millrace-ai>=0.23.0,<0.24.0"]

[project.scripts]
millrace-plus = "millrace_plus.router.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/millrace_plus"]

[tool.hatch.build.targets.sdist]
include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src/millrace_plus",
    "tests/router",
    "tests/test_package_metadata.py",
    "tests/test_public_package_boundary.py",
    "tests/test_agent_skill_assets.py",
    "tests/test_public_test_support_boundary.py",
    "tests/README.md",
    ".github/workflows/public-ci.yml",
    "docs/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests/router", "tests/test_package_metadata.py", "tests/test_public_package_boundary.py", "tests/test_agent_skill_assets.py", "tests/test_public_test_support_boundary.py"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider"]
markers = [
    "public: standalone public package tests",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
